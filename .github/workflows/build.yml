
name: Build Windows EXE

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Generate application icon from EXE COMPUTERS logo
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $source = [System.Drawing.Image]::FromFile((Join-Path $PWD "Assets/EXEComputersLogo.png"))
          try {
            $sizes = @(256, 128, 64, 48, 32, 16)
            $images = @()
            foreach ($size in $sizes) {
              $bitmap = New-Object System.Drawing.Bitmap($size, $size, [System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
              $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
              try {
                $graphics.Clear([System.Drawing.Color]::Transparent)
                $graphics.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
                $scale = [Math]::Min($size / $source.Width, $size / $source.Height)
                $width = [int][Math]::Round($source.Width * $scale)
                $height = [int][Math]::Round($source.Height * $scale)
                $x = [int](($size - $width) / 2)
                $y = [int](($size - $height) / 2)
                $graphics.DrawImage($source, $x, $y, $width, $height)
                $stream = New-Object System.IO.MemoryStream
                $bitmap.Save($stream, [System.Drawing.Imaging.ImageFormat]::Png)
                $images += ,([pscustomobject]@{ Size = $size; Bytes = $stream.ToArray() })
                $stream.Dispose()
              } finally {
                $graphics.Dispose()
                $bitmap.Dispose()
              }
            }
            $output = Join-Path $PWD "Assets/EXEComputers.ico"
            $file = [System.IO.File]::Create($output)
            $writer = New-Object System.IO.BinaryWriter($file)
            try {
              $writer.Write([UInt16]0)
              $writer.Write([UInt16]1)
              $writer.Write([UInt16]$images.Count)
              $offset = 6 + (16 * $images.Count)
              foreach ($image in $images) {
                $dimension = if ($image.Size -eq 256) { [byte]0 } else { [byte]$image.Size }
                $writer.Write($dimension)
                $writer.Write($dimension)
                $writer.Write([byte]0)
                $writer.Write([byte]0)
                $writer.Write([UInt16]1)
                $writer.Write([UInt16]32)
                $writer.Write([UInt32]$image.Bytes.Length)
                $writer.Write([UInt32]$offset)
                $offset += $image.Bytes.Length
              }
              foreach ($image in $images) { $writer.Write($image.Bytes) }
            } finally {
              $writer.Dispose()
              $file.Dispose()
            }
          } finally {
            $source.Dispose()
          }

      - name: Publish EXE
        run: dotnet publish UltimateCleaningUtility.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-Cleaning-Utility-V3
          path: publish/

# PR validation enabled for V3.1 stability changes.
